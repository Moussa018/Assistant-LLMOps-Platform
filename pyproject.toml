[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loraops"
version = "0.1.0"
description = "A pipeline to fine-tune, evaluate, gate, register and serve many LoRA adapters on one base model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Heavy ML stack: only needed where training / local evaluation runs (Colab, GPU box).
train = [
    "torch>=2.2",
    "transformers>=4.43",
    "peft>=0.11",
    "accelerate>=0.30",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
loraops = "loraops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a tiny real model on CPU (needs the [train] extras)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
