# Serving stack on a GPU machine: vLLM (one base model, many LoRA adapters) + gateway + Prometheus.
#
#   1. Train adapters (Colab notebook or `loraops run --all`) and copy the registry/ folder here.
#   2. docker compose up -d
#   3. curl localhost:8000/v1/classify -d '{"tenant":"acme","text":"where is my parcel?"}' \
#        -H 'Content-Type: application/json'
#
# The base model here must be the one in configs/pipeline.toml: adapters are tied to it.

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${BASE_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      --enable-lora
      --max-loras 8
      --max-lora-rank 16
      --max-model-len 2048
    environment:
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "True"   # lets the gateway load/unload adapters live
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./registry:/registry:ro
      - hf-cache:/root/.cache/huggingface
    ports: ["8001:8000"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  gateway:
    build: .
    environment:
      LORAOPS_VLLM_URL: http://vllm:8000
      LORAOPS_SYNC_INTERVAL: "15"
      LORAOPS_ADMIN_TOKEN: ${LORAOPS_ADMIN_TOKEN:-change-me}
    volumes:
      - ./registry:/app/registry          # promote/rollback write here
    ports: ["8000:8000"]
    depends_on: [vllm]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]

volumes:
  hf-cache:
