name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Pipeline, registry and gateway tests (no GPU, no model download)
        run: pytest -q -m "not slow"
      - name: Demo datasets are valid
        run: |
          loraops validate --tenant acme
          loraops validate --tenant globex

  train-smoke:
    # Real QLoRA code path on CPU with a tiny randomly initialised model: catches breakage in
    # training/evaluation code and library upgrades without needing a GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,train]"
      - run: pytest -q -m slow

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loraops-gateway:ci .
